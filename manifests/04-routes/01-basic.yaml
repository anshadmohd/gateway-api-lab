# STEP 1 - Basic routing.
# Every request for shop.localhost goes to the shop-v1 Service.
# RequestHeaderModifier adds x-lab-route so the app can show which route matched.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: lab-gateway
  hostnames:
    - shop.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-lab-route
                value: basic
      backendRefs:
        - name: shop-v1
          port: 80
