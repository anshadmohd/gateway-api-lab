# STEP 2 - URL rewrite.
# Browser asks for /legacy/...; the gateway strips /legacy before the app sees it.
# Requests to /legacy/api/whoami arrive at the app as /api/whoami.
# This is a second HTTPRoute. "/legacy" is a longer match than "/", so it wins for those paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-legacy
spec:
  parentRefs:
    - name: lab-gateway
  hostnames:
    - shop.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /legacy
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-lab-route
                value: rewrite
      backendRefs:
        - name: shop-v1
          port: 80
