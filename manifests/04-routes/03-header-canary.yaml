# STEP 3 - Header-based routing (canary).
# Replaces the "shop" route from step 1 (same name, so kubectl apply updates it).
# Rule 1: requests carrying "x-canary: true" go to shop-v2.
# Rule 2: everything else still goes to shop-v1.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: lab-gateway
  hostnames:
    - shop.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: x-canary
              value: "true"
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-lab-route
                value: canary
      backendRefs:
        - name: shop-v2
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-lab-route
                value: basic
      backendRefs:
        - name: shop-v1
          port: 80
